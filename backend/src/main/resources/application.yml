server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personalfinance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:110}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:personalfinance-wan-motor-secret-key-2025}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: token
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:3000}
  market:
    fetch-interval-ms: ${MARKET_FETCH_INTERVAL_MS:600000}
    tgju:
      geram18-widget-key: ${TGJU_GERAM18_KEY:137121}
      dollar-widget-key: ${TGJU_DOLLAR_KEY:137203}
    etf:
      ayar-ins-code: ${ETF_AYAR_INS_CODE:34144395039913458}
      narange-ins-code: ${ETF_NARANGE_INS_CODE:35831329532779850}
    conflict-threshold-percent: ${MARKET_CONFLICT_THRESHOLD_PERCENT:0.5}
  advisor:
    llm:
      api-key: ${ADVISOR_LLM_API_KEY:}
      model: ${ADVISOR_LLM_MODEL:claude-sonnet-4-20250514}
      cli-enabled: ${ADVISOR_LLM_CLI:true}
      cli-command: ${ADVISOR_LLM_CLI_COMMAND:}
      cli-model: ${ADVISOR_LLM_CLI_MODEL:}
      cli-timeout-seconds: ${ADVISOR_LLM_CLI_TIMEOUT_SECONDS:180}
  backup:
    dir: ${BACKUP_DIR:}
